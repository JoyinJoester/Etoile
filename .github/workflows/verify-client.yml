name: Client source verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK and NDK
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0' 'ndk;28.2.13676358'
      - name: Install Rust tooling
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify without packaging
        shell: pwsh
        run: |
          chmod +x gradlew
          ./scripts/verify-client.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check indexed dependency advisories
        run: python scripts/check-dependency-advisories.py
      - name: Preserve test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-verification-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-*
            app/build/reports/native-design/
            app/build/reports/acceptance/
