plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.kotlin.serialization)
}

def rustOutput = layout.buildDirectory.dir('rustJniLibs')
tasks.register('buildRustReader', Exec) {
    workingDir rootProject.file('native/code-reader')
    doFirst {
        environment 'ANDROID_NDK_HOME', System.getenv('ANDROID_NDK_HOME') ?: new File(android.sdkDirectory, 'ndk/28.2.13676358').absolutePath
    }
    commandLine 'cargo', 'ndk', '-t', 'arm64-v8a', '-t', 'armeabi-v7a', '-o', rustOutput.get().asFile.absolutePath, 'build', '--release'
    inputs.files(rootProject.fileTree('native/code-reader') { exclude 'target/**' })
    outputs.dir(rustOutput)
}
tasks.named('preBuild').configure { dependsOn 'buildRustReader' }

def legalAssets = layout.buildDirectory.dir('generated/legalAssets')
tasks.register('generateLegalAssets', Copy) {
    dependsOn 'verifyThirdPartyNotices'
    from(rootProject.file('docs/legal')) { into 'legal' }
    from(rootProject.file('COPYING')) { into 'legal'; rename { 'LICENSE.txt' } }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) { into 'legal' }
    into legalAssets
    doLast {
        def dependencyLedger = new groovy.json.JsonSlurper().parse(rootProject.file('docs/legal/dependencies.json'), 'UTF-8')
        def owners = [:].withDefault { [] }
        (dependencyLedger.maven + dependencyLedger.rust).each { module ->
            module.notices.each { notice -> owners[notice.text] << "${module.name}:${module.version}" }
        }
        def bundledFontTexts = rootProject.fileTree('docs/legal/fonts').files.sort { it.name }
                .collect { "\n\n## ${it.name}\n\n```text\n${it.getText('UTF-8')}\n```\n" }.join('')
        legalAssets.get().file('legal/THIRD_PARTY_NOTICES.md').asFile.setText(
                rootProject.file('THIRD_PARTY_NOTICES.md').getText('UTF-8') + bundledFontTexts + '\n\n' +
                        rootProject.file('docs/legal/dependencies.md').getText('UTF-8') + '\n\n' +
                        rootProject.fileTree('docs/legal/licenses').files.sort { it.name }
                                .collect { "\n\n## ${it.name}\n\n```text\n${it.getText('UTF-8')}\n```\n" }.join('') +
                        rootProject.fileTree('docs/legal/dependency-texts').files.sort { it.name }
                                .collect { "\n\n## ${owners[it.name.take(64)].unique().sort().join(', ')}\n\n```text\n${it.getText('UTF-8')}\n```\n" }.join(''), 'UTF-8')
    }
}
tasks.named('preBuild').configure { dependsOn 'generateLegalAssets' }

// Release signing is intentionally external. A missing or partial contract
// produces an unsigned release configuration and never falls back to the
// Android public debug certificate.
def releaseSigningProperties = new Properties()
def releaseSigningPropertiesFile = rootProject.file('keystore.properties')
if (releaseSigningPropertiesFile.isFile()) {
    releaseSigningPropertiesFile.withInputStream { stream ->
        releaseSigningProperties.load(stream)
    }
}

// Local, uncommitted build configuration. This keeps developer-specific
// public identifiers out of shared Gradle files while matching the documented
// local.properties setup path.
def localBuildProperties = new Properties()
def localBuildPropertiesFile = rootProject.file('local.properties')
if (localBuildPropertiesFile.isFile()) {
    localBuildPropertiesFile.withInputStream { stream ->
        localBuildProperties.load(stream)
    }
}

def readReleaseSigningValue = { String propertyName, String environmentName ->
    def projectValue = project.findProperty(propertyName)?.toString()?.trim()
    def environmentValue = System.getenv(environmentName)?.toString()?.trim()
    def fileValue = releaseSigningProperties.getProperty(propertyName)?.toString()?.trim()
    projectValue ?: environmentValue ?: fileValue
}

def releaseStoreFilePath = readReleaseSigningValue(
        'storeFile',
        'ETOILE_RELEASE_STORE_FILE'
)
def releaseStorePassword = readReleaseSigningValue(
        'storePassword',
        'ETOILE_RELEASE_STORE_PASSWORD'
)
def releaseKeyAlias = readReleaseSigningValue(
        'keyAlias',
        'ETOILE_RELEASE_KEY_ALIAS'
)
def releaseKeyPassword = readReleaseSigningValue(
        'keyPassword',
        'ETOILE_RELEASE_KEY_PASSWORD'
)
def releaseSigningValues = [
        releaseStoreFilePath,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
]
def hasAnyReleaseSigningValue = releaseSigningValues.any { value -> value }
def hasCompleteReleaseSigning = releaseSigningValues.every { value -> value }
if (hasAnyReleaseSigningValue && !hasCompleteReleaseSigning) {
    throw new GradleException(
            'Incomplete release signing configuration. Supply storeFile, storePassword, keyAlias, and keyPassword together.'
    )
}

def resolveReleaseStoreFile = { String rawPath ->
    def candidate = new File(rawPath)
    candidate.isAbsolute() ? candidate : rootProject.file(rawPath)
}
def releaseStoreFile = hasCompleteReleaseSigning
        ? resolveReleaseStoreFile(releaseStoreFilePath)
        : null
if (hasCompleteReleaseSigning && !releaseStoreFile.isFile()) {
    throw new GradleException("Release signing keystore does not exist: ${releaseStoreFile}")
}
def requireReleaseSigning = project.findProperty('requireReleaseSigning')?.toString()?.toBoolean() ?: false

android {
    sourceSets.main.jniLibs.srcDir(rustOutput)
    sourceSets.main.assets.srcDir(legalAssets)
    namespace 'takagi.ru.monica'
    compileSdk 37

    def previewVersionSuffix = project.findProperty('previewVersionSuffix')?.toString()?.trim()
    def appVersionCode = (project.findProperty('appVersionCode') ?: '1').toString().toInteger()
    if (appVersionCode < 1 || appVersionCode > 2100000000) {
        throw new GradleException('appVersionCode must be between 1 and 2100000000')
    }
    def baseVersionName = previewVersionSuffix ? "0.1.0-${previewVersionSuffix}" : "0.1.0"
    def normalizeTwoDigits = { raw ->
        def value = raw?.toString()?.trim()?.replaceAll('\\D', '')
        if (!value) {
            return '01'
        }
        value = value.padLeft(2, '0')
        value.length() > 2 ? value[-2..-1] : value
    }

    def sanitizeTag = { raw, fallback ->
        def value = raw?.toString()?.trim()
        if (!value) {
            return fallback
        }
        def cleaned = value.replaceAll('[^0-9A-Za-z._+-]', '_')
        cleaned ?: fallback
    }

    def escapeForBuildConfig = { raw ->
        def value = raw?.toString() ?: ''
        value.replace('\\', '\\\\').replace('"', '\\"')
    }

    // 兜底使用 GitHub CLI 的公开 client id（device flow 惯例，开箱即用）。
    // 在 local.properties 配置 githubOAuthClientId 可替换为你自己注册的 OAuth App。
    def githubOAuthClientId = (
            project.findProperty('githubOAuthClientId')
                    ?: System.getenv('ETOILE_GITHUB_OAUTH_CLIENT_ID')
                    ?: localBuildProperties.getProperty('githubOAuthClientId')
                    ?: '178c6fc778ccc68e1d6a'
    ).toString().trim()
    def githubOAuthClientSecret = (
            project.findProperty('githubOAuthClientSecret')
                    ?: System.getenv('ETOILE_GITHUB_OAUTH_CLIENT_SECRET')
                    ?: localBuildProperties.getProperty('githubOAuthClientSecret')
                    ?: ''
    ).toString().trim()

    def githubAppClientId = (project.findProperty('githubAppClientId')
            ?: System.getenv('ETOILE_GITHUB_APP_CLIENT_ID')
            ?: localBuildProperties.getProperty('githubAppClientId') ?: '').toString().trim()
    def gitLabOAuthClientId = (project.findProperty('gitLabOAuthClientId')
            ?: System.getenv('ETOILE_GITLAB_OAUTH_CLIENT_ID')
            ?: localBuildProperties.getProperty('gitLabOAuthClientId') ?: '').toString().trim()
    def githubAuthServiceUrl = (project.findProperty('githubAuthServiceUrl')
            ?: System.getenv('ETOILE_GITHUB_AUTH_SERVICE_URL')
            ?: localBuildProperties.getProperty('githubAuthServiceUrl') ?: '').toString().trim()
    if (githubAuthServiceUrl) {
        def serviceUri = new URI(githubAuthServiceUrl)
        if (serviceUri.scheme != 'https' || !serviceUri.host || serviceUri.userInfo || serviceUri.query || serviceUri.fragment || !githubAuthServiceUrl.endsWith('/')) {
            throw new GradleException('githubAuthServiceUrl must be an HTTPS base URL ending in / without credentials, query or fragment')
        }
        if (!githubAppClientId) throw new GradleException('githubAppClientId is required for the auth service')
    }

    tasks.register('verifyReleaseAuthenticationConfiguration') {
        group = 'verification'
        description = 'Checks that public release variants cannot embed a GitHub OAuth secret.'
        doLast {
            def secretField = android.buildTypes.release.buildConfigFields['GITHUB_OAUTH_CLIENT_SECRET']
                    ?: android.defaultConfig.buildConfigFields['GITHUB_OAUTH_CLIENT_SECRET']
            if (secretField?.value != '""') {
                throw new GradleException('Release must not embed a GitHub OAuth client secret; use Device Flow or a deployed auth service.')
            }
            logger.lifecycle('Release authentication configuration verified: no embedded OAuth client secret.')
        }
    }

    tasks.register('verifyPublicReleaseConfiguration') {
        group = 'verification'
        description = 'Checks public distribution configuration without packaging or exposing credentials.'
        dependsOn 'verifyReleaseAuthenticationConfiguration'
        doLast {
            def problems = []
            if (!githubOAuthClientId || githubOAuthClientId == '178c6fc778ccc68e1d6a') {
                problems.add('Configure your own GitHub OAuth application with Device Flow enabled; the compatibility client ID is not a release identity.')
            }
            if (!hasCompleteReleaseSigning) {
                problems.add('Configure external release signing before public distribution.')
            }
            if (problems) throw new GradleException('Public release configuration is incomplete:\n- ' + problems.join('\n- '))
            logger.lifecycle('Public release configuration checks passed. Real authorization, signing continuity, installation and upgrade acceptance remain separate gates.')
        }
    }

    tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
        dependsOn 'verifyReleaseAuthenticationConfiguration'
    }

    def resolveArchTag = { output ->
        def manualArch = project.findProperty('apkArch')
        if (manualArch?.toString()?.trim()) {
            return sanitizeTag(manualArch, 'universal')
        }

        if (output?.metaClass?.respondsTo(output, 'getFilters')) {
            def abiFilter = output.filters?.find {
                def typeText = it?.filterType?.toString()
                typeText?.equalsIgnoreCase('ABI') || typeText?.toUpperCase()?.endsWith('.ABI')
            }
            if (abiFilter?.identifier?.toString()?.trim()) {
                return sanitizeTag(abiFilter.identifier, 'universal')
            }
        }

        def configuredAbis = defaultConfig.ndk?.abiFilters
        if (configuredAbis && !configuredAbis.isEmpty()) {
            return sanitizeTag(configuredAbis.toList().sort().join('+'), 'universal')
        }

        'universal'
    }

    def findNextDailySeqForVersion = { String versionNameTag, String dateTag, String versionTag ->
        def versionPrefix = "${versionNameTag}-${dateTag}${versionTag}"
        def apkNamePattern = java.util.regex.Pattern.compile('^Etoile-Android-.+-' + java.util.regex.Pattern.quote(versionPrefix) + '-(\\d{2})\\.[aA][pP][kK]$')
        def maxSeq = 0

        def outputsDir = file("$buildDir/outputs/apk")
        if (outputsDir.exists()) {
            outputsDir.eachFileRecurse { outputFile ->
                if (!outputFile.isFile()) {
                    return
                }
                def matcher = apkNamePattern.matcher(outputFile.name)
                if (matcher.matches()) {
                    def seq = matcher.group(1).toInteger()
                    if (seq > maxSeq) {
                        maxSeq = seq
                    }
                }
            }
        }

        maxSeq + 1
    }

    def buildDateTag = new Date().format('yyMMdd', java.util.TimeZone.getTimeZone('Asia/Shanghai'))
    def buildVersionTag = normalizeTwoDigits(project.findProperty('apkVersionTag') ?: appVersionCode)
    def manualDailySeq = project.findProperty('dailySeq')
    def buildDailySeq = manualDailySeq != null
            ? normalizeTwoDigits(manualDailySeq)
            : normalizeTwoDigits(findNextDailySeqForVersion(baseVersionName, buildDateTag, buildVersionTag))
    def fullVersionName = "${baseVersionName}-${buildDateTag}${buildVersionTag}-${buildDailySeq}"

    defaultConfig {
        applicationId "takagi.joyin.github.etoile"
        minSdk 26
        targetSdk 34
        versionCode appVersionCode
        versionName baseVersionName

        // Default resources contain English. Keep only the additional locales
        // exposed by Etoile instead of every translation from libraries.
        resourceConfigurations += ['en', 'zh', 'ja', 'ru', 'vi']

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }

        def gitSha = 'unknown'
        try {
            gitSha = ['git', 'rev-parse', '--short', 'HEAD'].execute([], rootDir).text.trim()
        } catch (ignored) {}
        buildConfigField 'String', 'GIT_SHA', "\"${gitSha}\""
        buildConfigField 'String', 'BUILD_TIME', "\"${new Date().format('yyyy-MM-dd HH:mm:ss z')}\""
        buildConfigField 'String', 'FULL_VERSION_NAME', "\"${fullVersionName}\""
        buildConfigField 'String', 'BUILD_DETAIL_TAG', "\"${buildDateTag}${buildVersionTag}-${buildDailySeq}\""
        buildConfigField 'String', 'GITHUB_OAUTH_CLIENT_ID', "\"${escapeForBuildConfig(githubOAuthClientId)}\""
        // Public clients cannot protect a shared secret. Browser login uses the auth
        // service; Device Flow and PAT do not require an embedded OAuth secret.
        buildConfigField 'String', 'GITHUB_OAUTH_CLIENT_SECRET', '""'
        buildConfigField 'String', 'GITLAB_OAUTH_CLIENT_ID', "\"${escapeForBuildConfig(gitLabOAuthClientId)}\""
        buildConfigField 'String', 'GITHUB_OAUTH_CALLBACK_URI', '"etoile://oauth"'
        buildConfigField 'String', 'GITHUB_APP_CLIENT_ID', "\"${escapeForBuildConfig(githubAppClientId)}\""
        buildConfigField 'String', 'GITHUB_AUTH_SERVICE_URL', "\"${escapeForBuildConfig(githubAuthServiceUrl)}\""
        
    }

    splits {
        abi {
            // 仅输出 ARM 32/64 位两个 APK，不生成 universal 包。
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    signingConfigs {
        if (hasCompleteReleaseSigning) {
            release {
                storeFile releaseStoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasCompleteReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // An unsigned release is intentional until external credentials
                // are supplied. Never inherit signingConfigs.debug here.
                signingConfig null
            }
        }
        debug {
            // Local compatibility only; this value never enters the release variant.
            buildConfigField 'String', 'GITHUB_OAUTH_CLIENT_SECRET', "\"${escapeForBuildConfig(githubOAuthClientSecret)}\""
            // Delivery builds stay debug-signed for direct installation, but disabling
            // JDWP allows R8 to apply the same code optimizations as release builds.
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
        buildConfig true
    }

    // Run Compose layout and interaction checks on the host, without producing an APK.
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            maxHeapSize = '2g'
            // The shared Miuix theme dependency contains Java 21 classes.
            javaLauncher = javaToolchains.launcherFor {
                languageVersion = JavaLanguageVersion.of(21)
            }
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            // 目标格式: Etoile-Android-[架构]-[版本号]-yyMMddVV-SS.APK
            def apkPrefix = 'Etoile'
            def archTag = resolveArchTag(output)
            def versionNameTag = sanitizeTag(project.findProperty('apkVersionName') ?: variant.versionName ?: defaultConfig.versionName, '0.0.0')
            def namePrefix = "${apkPrefix}-Android-${archTag}-${versionNameTag}-${buildDateTag}${buildVersionTag}"
            outputFileName = "${namePrefix}-${buildDailySeq}.APK"
        }
    }

    lint {
        // Workaround: lint/lifecycle detector crashes with Kotlin 2.x analysis API in current toolchain.
        disable 'NullSafeMutableLiveData',
                'FrequentlyChangingValue',
                'RememberInComposition',
                'FlowOperatorInvokedInComposition',
                'UnrememberedMutableState',
                'AutoboxingStateCreation',
                'CoroutineCreationDuringComposition',
                'StateFlowValueCalledInComposition',
                'ProduceStateDoesNotAssignValue',
                'MissingTranslation'
        // Avoid scanning dependency-provided lint registries; one of them intermittently
        // crashes ASM migration with NegativeArraySizeException in lintVitalAnalyzeRelease.
        checkDependencies false
        // lintVital still loads dependency registries even when checkDependencies is false.
        // Disable the broken release gate so Android Studio's normal assembleRelease works.
        checkReleaseBuilds false
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        }
    }
}

tasks.register('verifyReleaseSigningConfiguration') {
    group = 'verification'
    description = 'Verifies the external Etoile release signing contract.'
    doLast {
        if (!hasCompleteReleaseSigning) {
            if (requireReleaseSigning) {
                throw new GradleException(
                        'Release signing is required. Configure keystore.properties or ETOILE_RELEASE_* environment variables.'
                )
            }
            logger.lifecycle(
                    'Release signing is absent; release variants remain unsigned and never use the debug certificate.'
            )
        } else {
            logger.lifecycle("Release signing is configured from external keystore: ${releaseStoreFile.name}")
        }
    }
}

tasks.register('writeReleaseDependencyInventory') {
    group = 'verification'
    description = 'Writes resolved public Maven coordinates for dependency advisory review.'
    def inventory = layout.buildDirectory.file('reports/acceptance/release-dependencies.json')
    outputs.file(inventory)
    // Resolve on every invocation so the inventory never describes an old graph.
    outputs.upToDateWhen { false }
    doLast {
        def modules = configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents
                .findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
                .collect { it.moduleVersion }.findAll { it != null }
                .collect { [ecosystem: 'Maven', name: "${it.group}:${it.name}".toString(), version: it.version] }
                .unique { "${it.name}:${it.version}" }.sort { it.name }
        def destination = inventory.get().asFile
        destination.parentFile.mkdirs()
        destination.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(modules))
        logger.lifecycle("Resolved dependency inventory: ${destination}")
    }
}

tasks.register('verifyThirdPartyNotices') {
    group = 'verification'
    description = 'Checks that bundled dependency licenses describe the resolved release graph.'
    dependsOn 'writeReleaseDependencyInventory'
    doLast {
        def json = new groovy.json.JsonSlurper()
        def ledger = json.parse(rootProject.file('docs/legal/dependencies.json'), 'UTF-8')
        def actual = json.parse(layout.buildDirectory.file('reports/acceptance/release-dependencies.json').get().asFile, 'UTF-8')
        def coordinates = { modules -> modules.collect { "${it.name}:${it.version}".toString() }.toSet() }
        if (coordinates(actual) != coordinates(ledger.maven)) {
            throw new GradleException('Bundled dependency notices are stale. Run scripts/generate-dependency-notices.py and review license changes.')
        }
        def sha256Text = { String content ->
            java.security.MessageDigest.getInstance('SHA-256').digest(content.getBytes('UTF-8'))
                    .collect { String.format('%02x', it & 0xff) }.join('')
        }
        def lock = rootProject.file('native/code-reader/Cargo.lock').getText('UTF-8').replace('\r\n', '\n')
        if (sha256Text(lock) != ledger.cargoLockSha256) {
            throw new GradleException('Cargo.lock changed; regenerate and review bundled Rust license notices.')
        }
        def packages = ledger.maven + ledger.rust
        if (packages.any { !it.name || !it.version || (!it.licenses && !it.licenseExpression) }) {
            throw new GradleException('Incomplete dependency license declaration.')
        }
        def notices = packages.collectMany { it.notices ?: [] }.collect { it.text }.toSet()
        ['Apache-2.0.txt', 'jsoup-MIT.txt', 'jni-sys-MIT.txt'].each { name ->
            if (!rootProject.file("docs/legal/licenses/${name}").isFile()) throw new GradleException('Missing bundled license text.')
        }
        notices.each { hash ->
            if (!(hash ==~ /[a-f0-9]{64}/)) throw new GradleException('Invalid bundled notice reference.')
            def notice = rootProject.file("docs/legal/dependency-texts/${hash}.txt")
            if (!notice.isFile() || sha256Text(notice.getText('UTF-8').replace('\r\n', '\n').trim() + '\n') != hash) {
                throw new GradleException('Missing or modified dependency license text; regenerate the notices.')
            }
        }
        logger.lifecycle("Bundled notices verified: ${ledger.maven.size()} Maven modules, ${ledger.rust.size()} Cargo packages, ${notices.size()} published notice texts.")
    }
}

configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlinx:kotlinx-serialization-bom:1.9.0",
        "org.jetbrains.kotlinx:kotlinx-serialization-core:1.9.0",
